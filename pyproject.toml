[project]
name = "rlm-switch"
version = "0.1.0"
description = "Learned recursion-vs-compaction switching policy for LLM inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.7.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "wandb>=0.16.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "datasets>=2.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ipython>=8.0.0"]
